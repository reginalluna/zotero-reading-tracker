# Builds and publishes the Zotero XPI from the version in manifest.json.
name: Release XPI

on:
  push:
    branches:
      - main
    paths:
      - bootstrap.js
      - manifest.json
      - update.json
      - .github/workflows/release.yml
  pull_request:
    branches:
      - main
    paths:
      - bootstrap.js
      - manifest.json
      - update.json
      - .github/workflows/release.yml
      - README.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        run: |
          node --check bootstrap.js
          jq -e . manifest.json > /dev/null
          jq -e . update.json > /dev/null
          version="$(jq -r '.version' manifest.json)"
          jq -e --arg version "$version" '.addons["reginamarza@gmail.com"].updates | length == 1 and .[0].version == $version' update.json > /dev/null
          grep -q 'await target.save();' bootstrap.js
          if grep -q 'await target.saveTx();' bootstrap.js; then
            echo 'Reading status must use save() inside the existing transaction.'
            exit 1
          fi

      - name: Build XPI
        id: package
        env:
          TZ: America/Toronto
        run: |
          version="$(jq -r '.version' manifest.json)"
          xpi="zotero-reading-progress-${version}.xpi"
          touch bootstrap.js manifest.json
          zip -X -q "$xpi" manifest.json bootstrap.js
          unzip -t "$xpi"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: zotero-reading-progress-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.xpi }}
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.package.outputs.version }}"
          xpi="${{ steps.package.outputs.xpi }}"
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$xpi" --clobber
          else
            gh release create "$tag" "$xpi" \
              --target "${{ github.sha }}" \
              --title "$tag" \
              --notes "Fix Reading Status writes by using save() inside Zotero's existing database transaction instead of starting a nested saveTx() transaction. Retains Zotero 7-10 compatibility, native item-tree rendering, and explicit column refreshes."
          fi

      - name: Remove superseded releases and tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="v${{ steps.package.outputs.version }}"
          old_tags="v2.1.0 v2.2.0 v2.2.1 v2.3.0 v2.3.1 v2.3.2 v2.3.3"

          for tag in $old_tags; do
            gh release delete "$tag" --yes >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
          done

          gh release view "$keep" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${keep}" >/dev/null

          for tag in $old_tags; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Old release still exists: $tag"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Old tag still exists: $tag"
              exit 1
            fi
          done
